---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "datakit-operator.fullname" . }}-election
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "datakit-operator.fullname" . }}-election
subjects:
- kind: ServiceAccount
  name: {{ include "datakit-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
