before_script:
  - rm -rf /root/go/src/gitlab.jiagouyun.com/cloudcare-tools/datakit-operator
  - mkdir -p /root/go/src/gitlab.jiagouyun.com/cloudcare-tools/datakit-operator
  - cp -r ./. /root/go/src/gitlab.jiagouyun.com/cloudcare-tools/datakit-operator
  - cd /root/go/src/gitlab.jiagouyun.com/cloudcare-tools/datakit-operator
  - source ~/.ossenv
  - |
    export GO_DIST_ARCH="$(uname -m)"
    if [ "$GO_DIST_ARCH" = "x86_64" ] || [ "$GO_DIST_ARCH" = "amd64" ]; then
      export GO_DIST_ARCH="amd64"
    elif [ "$GO_DIST_ARCH" = "aarch64" ] || [ "$GO_DIST_ARCH" = "arm64" ]; then
      export GO_DIST_ARCH="arm64"
    else
      echo "unsupported architecture: $GO_DIST_ARCH"
      exit 1
    fi
    export GO_VERSION_NORMALIZED="${DK_GO_VERSION#go}"
    export GO_DIST_TARBALL="go${GO_VERSION_NORMALIZED}.linux-${GO_DIST_ARCH}.tar.gz"
    export GO_DIST_URL="https://dl.google.com/go/${GO_DIST_TARBALL}"
    export GO_CACHE_ROOT="/tmp/datakit-operator-ci/go"
    export GOROOT="${GO_CACHE_ROOT}/${GO_VERSION_NORMALIZED}"
    mkdir -p "$GO_CACHE_ROOT"
    rm -rf "$GOROOT"
    echo "download golang from $GO_DIST_URL"
    https_proxy="$CC_HTTP_PROXY" curl -sSfL "$GO_DIST_URL" -o "${GO_CACHE_ROOT}/${GO_DIST_TARBALL}"
    tar -C "$GO_CACHE_ROOT" -xzf "${GO_CACHE_ROOT}/${GO_DIST_TARBALL}"
    mv "${GO_CACHE_ROOT}/go" "$GOROOT"
    export PATH="$GOROOT/bin:$PATH"
  - go version
  - |
    export GOLANGCI_LINT_VERSION_NORMALIZED="${GOLANGCI_LINT_VERSION#v}"
    export GOLANGCI_LINT_ARCHIVE="golangci-lint-${GOLANGCI_LINT_VERSION_NORMALIZED}-linux-${GO_DIST_ARCH}.tar.gz"
    export GOLANGCI_LINT_URL="https://github.com/golangci/golangci-lint/releases/download/${GOLANGCI_LINT_VERSION}/${GOLANGCI_LINT_ARCHIVE}"
    export GOLANGCI_LINT_CACHE_ROOT="/tmp/datakit-operator-ci/golangci-lint"
    if [ "$GO_DIST_ARCH" = "amd64" ]; then
      export GOLANGCI_LINT_SHA256="200c5b7503f67b59a6743ccf32133026c174e272b930ee79aa2aa6f37aca7ef1"
    else
      export GOLANGCI_LINT_SHA256="3bcfa2e6f3d32b2bf5cd75eaa876447507025e0303698633f722a05331988db4"
    fi
    mkdir -p "$GOLANGCI_LINT_CACHE_ROOT" ./bin
    https_proxy="$CC_HTTP_PROXY" curl -sSfL "$GOLANGCI_LINT_URL" -o "${GOLANGCI_LINT_CACHE_ROOT}/${GOLANGCI_LINT_ARCHIVE}"
    echo "${GOLANGCI_LINT_SHA256}  ${GOLANGCI_LINT_CACHE_ROOT}/${GOLANGCI_LINT_ARCHIVE}" | sha256sum -c -
    tar -C ./bin --strip-components=1 -xzf "${GOLANGCI_LINT_CACHE_ROOT}/${GOLANGCI_LINT_ARCHIVE}" \
      "golangci-lint-${GOLANGCI_LINT_VERSION_NORMALIZED}-linux-${GO_DIST_ARCH}/golangci-lint"
  - ./bin/golangci-lint version

variables:
  PROJECT: "datakit-operator"
  DK_GO_VERSION: "1.26.2"
  GOLANGCI_LINT_VERSION: "v2.11.4"
  GOLANGCI_LINT_BIN: "./bin/golangci-lint"

stages:
  - test
  - deploy

test:
  stage: test
  resource_group: production
  only:
    - /^.*$/
  script:
    - nvm use v16.14.0
    - make lint GOLINT_BINARY="$GOLANGCI_LINT_BIN"
  tags:
    - cloudcare-ft

release-testing:
  stage: deploy
  resource_group: production
  needs: [test]
  only:
    - /^dev.*$/
  script:
    - make clean
    - make
    - make pub_testing_image
  tags:
    - cloudcare-ft

release-rc-image:
  stage: deploy
  resource_group: production
  needs: [test]
  rules:
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true
  script:
    - |
      export RC_DATE="$(TZ=Asia/Shanghai date +%Y%m%d)"
      export RC_VERSION="$(make --no-print-directory print_rc_version RC_DATE="$RC_DATE")"
      export SHA_VERSION="sha-$(printf '%.12s' "$CI_COMMIT_SHA")"
      echo "publishing RC images with tags $RC_VERSION and $SHA_VERSION"
      make VERSION="$RC_VERSION"
      make pub_rc_image RC_DATE="$RC_DATE" RC_VERSION="$RC_VERSION" SHA_VERSION="$SHA_VERSION"
  tags:
    - cloudcare-ft

release-stable:
  stage: deploy
  resource_group: production
  needs: [test]
  only:
    - main
  script:
    - make clean
    - make
    - make pub_image
    - make pub_uos_image
  tags:
    - cloudcare-ft

